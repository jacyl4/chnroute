stages:
  - build

workflow:
  rules:
    - if: '$CI_PIPELINE_SOURCE == "schedule"'
    - if: '$CI_PIPELINE_SOURCE == "web"'
    - when: never

variables:
  GIT_STRATEGY: clone

build_pbr:
  stage: build
  tags:
    - shell
  before_script:
    - git config --global user.name "${GITLAB_USER_NAME:-ci-bot}"
    - git config --global user.email "${GITLAB_USER_EMAIL:-ci-bot@gitlab.seso.icu}"
  script:
    - |
      set -euo pipefail
      
      rm -rf /tmp/chnroute
      cp -r "${CI_PROJECT_DIR}" /tmp/chnroute
      cd /tmp/chnroute

      python3 -B scripts/update_ipchnroute.py

      chmod +x scripts/ros-dpbr.sh
      ./scripts/ros-dpbr.sh

      chmod +x scripts/Domains_chnlist.sh
      ./scripts/Domains_chnlist.sh

      if [[ -n $(git status --porcelain) ]]; then
        echo "Found changes to commit."
        git add -A
        git commit -m "Update generated assets $(date -u +'%Y-%m-%d %H:%M:%S UTC')"
        git push origin "HEAD:${CI_COMMIT_BRANCH:-$CI_COMMIT_REF_NAME}"
      else
        echo "No changes to commit."
      fi
      
      cd "${CI_PROJECT_DIR}"
      rm -rf /tmp/chnroute
  after_script:
    - cd /
    - rm -rf "${CI_PROJECT_DIR}"
